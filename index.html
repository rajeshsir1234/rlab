<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Shooter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#05051a;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}
canvas{
  display:block;
  background:linear-gradient(#05051a,#10002b);
}
#ui{
  position:fixed;
  top:10px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  font-size:18px;
  font-weight:bold;
  pointer-events:none;
}
#start{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:15px 35px;
  border:0;
  border-radius:30px;
  background:#00eaff;
  color:#001018;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}
#controls{
  position:fixed;
  bottom:20px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
}
.ctrl{
  width:70px;
  height:60px;
  border-radius:20px;
  border:2px solid #00eaff;
  background:#07152d;
  color:white;
  font-size:25px;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div>🚀 Score: <span id="score">0</span></div>
  <div>❤️ Lives: <span id="lives">3</span></div>
</div>

<button id="start">START GAME</button>

<div id="controls">
  <button class="ctrl" id="left">⬅️</button>
  <button class="ctrl" id="fire">🔥</button>
  <button class="ctrl" id="right">➡️</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let player, bullets, enemies, stars;
let score=0,lives=3,game=false;
let left=false,right=false,fire=false;
let lastShot=0,spawnTimer=0;

function reset(){
  player={x:W/2,y:H-90,w:40,h:45,speed:7};
  bullets=[];
  enemies=[];
  stars=[];
  score=0;
  lives=3;

  for(let i=0;i<100;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      s:Math.random()*2+1
    });
  }
  updateUI();
}

function updateUI(){
  document.getElementById("score").textContent=score;
  document.getElementById("lives").textContent=lives;
}

function drawPlayer(){
  ctx.fillStyle="#00eaff";
  ctx.beginPath();
  ctx.moveTo(player.x,player.y);
  ctx.lineTo(player.x-22,player.y+40);
  ctx.lineTo(player.x,player.y+30);
  ctx.lineTo(player.x+22,player.y+40);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(player.x,player.y+18,5,0,Math.PI*2);
  ctx.fill();
}

function shoot(){
  let now=Date.now();
  if(fire && now-lastShot>220){
    bullets.push({
      x:player.x,
      y:player.y-10,
      speed:10
    });
    lastShot=now;
  }
}

function spawnEnemy(){
  enemies.push({
    x:30+Math.random()*(W-60),
    y:-40,
    r:18,
    speed:2+Math.random()*2+score/1000
  });
}

function collision(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y)<b.r+8;
}

function update(){
  if(!game)return;

  if(left)player.x-=player.speed;
  if(right)player.x+=player.speed;

  player.x=Math.max(25,Math.min(W-25,player.x));

  shoot();

  bullets.forEach(b=>b.y-=b.speed);
  bullets=bullets.filter(b=>b.y>-20);

  spawnTimer++;
  if(spawnTimer>Math.max(20,55-score/30)){
    spawnEnemy();
    spawnTimer=0;
  }

  enemies.forEach(e=>e.y+=e.speed);

  for(let i=enemies.length-1;i>=0;i--){
    let e=enemies[i];

    if(e.y>H+30){
      enemies.splice(i,1);
      lives--;
      updateUI();
      if(lives<=0)endGame();
      continue;
    }

    if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+25){
      enemies.splice(i,1);
      lives--;
      updateUI();
      if(lives<=0)endGame();
      continue;
    }

    for(let j=bullets.length-1;j>=0;j--){
      let b=bullets[j];
      if(collision(b,e)){
        enemies.splice(i,1);
        bullets.splice(j,1);
        score+=10;
        updateUI();
        break;
      }
    }
  }

  stars.forEach(s=>{
    s.y+=s.s;
    if(s.y>H){
      s.y=0;
      s.x=Math.random()*W;
    }
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // stars
  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.globalAlpha=.7;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  });
  ctx.globalAlpha=1;

  if(!game)return;

  drawPlayer();

  // bullets
  ctx.fillStyle="#00ff88";
  bullets.forEach(b=>{
    ctx.fillRect(b.x-3,b.y,6,15);
  });

  // enemies
  enemies.forEach(e=>{
    ctx.fillStyle="#ff1744";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#500018";
    ctx.beginPath();
    ctx.arc(e.x-6,e.y-3,4,0,Math.PI*2);
    ctx.arc(e.x+6,e.y-3,4,0,Math.PI*2);
    ctx.fill();
  });
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame(){
  reset();
  game=true;
  document.getElementById("start").style.display="none";
}

function endGame(){
  game=false;
  let btn=document.getElementById("start");
  btn.textContent="GAME OVER — SCORE "+score+" 🔄";
  btn.style.display="block";
}

document.getElementById("start").onclick=startGame;

// Keyboard
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")left=true;
  if(e.key==="ArrowRight"||e.key==="d")right=true;
  if(e.key===" ")fire=true;
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")left=false;
  if(e.key==="ArrowRight"||e.key==="d")right=false;
  if(e.key===" ")fire=false;
});

// Mobile buttons
function hold(id,variable){
  let el=document.getElementById(id);
  el.addEventListener("touchstart",e=>{
    e.preventDefault();
    window[variable]=true;
  });
  el.addEventListener("touchend",e=>{
    e.preventDefault();
    window[variable]=false;
  });
  el.addEventListener("mousedown",()=>window[variable]=true);
  el.addEventListener("mouseup",()=>window[variable]=false);
  el.addEventListener("mouseleave",()=>window[variable]=false);
}

hold("left","left");
hold("right","right");
hold("fire","fire");

reset();
loop();
</script>
</body>
</html>
